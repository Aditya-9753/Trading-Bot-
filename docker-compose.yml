# Production-like stack: MySQL 8 + FastAPI backend (1 worker) + nginx serving the React app.
#   cp .env.example .env   # then edit the secrets
#   docker compose up --build
#   open http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tradebot
      MYSQL_USER: tradebot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://tradebot:${MYSQL_PASSWORD}@mysql:3306/tradebot?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      ENABLE_SIMULATOR: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      TICK_SECONDS: ${TICK_SECONDS:-1}
      TICKS_PER_BAR: ${TICKS_PER_BAR:-30}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mysql-data:
