[project]
name = "tradebot-backend"
version = "1.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E9",  # syntax errors
    "F63", # identity comparisons
    "F7",  # syntax
    "F82", # undefined symbols
]
ignore = [
    "E501",
]
