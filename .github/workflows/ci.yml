name: CI Pipeline

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (Python / FastAPI / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code quality & syntax check (Ruff)
        run: |
          ruff check app tests

      - name: Run Backend Test Suite (Pytest)
        run: |
          pytest
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET: ci-test-secret-key-32-chars-long!
          ENABLE_SIMULATOR: "false"

  frontend-test:
    name: Frontend (TypeScript / React / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: |
          npm run typecheck

      - name: Run Frontend Unit Tests (Vitest)
        run: |
          npm test

      - name: Build Production Assets
        run: |
          npm run build

  docker-build-test:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: tradebot-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test build Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: tradebot-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
